<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetClinicOS — practice console</title>
<!--
  No-build console for the delivered platform.

  Written by the factory WRITER role (codewhale exec).

  Every panel calls the booted platform's own routes (/v1/{capability} POST
  and GET, /v1/schema/{capability}, /v1/rag/query, /v1/offline, /health) with
  the platform token. There is no second API and no mock data: this page and
  frontend/src/App.tsx (the React build) drive the same live routes.
-->
<style>
 :root{color-scheme:light dark;font-family:system-ui,Segoe UI,Roboto,sans-serif}
 body{margin:0;padding:1.5rem;max-width:70rem}
 header{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
 h2{margin-top:2rem}
 table{border-collapse:collapse;width:100%;margin-top:.5rem}
 th,td{border-bottom:1px solid #8884;padding:.35rem;text-align:left;font-size:.9rem}
 input,select,textarea,button{font:inherit;padding:.3rem}
 label{display:block;margin:.3rem 0}
 #status{font-weight:600}
 .muted{opacity:.7}
</style>
</head>
<body>
<header>
  <h1>VetClinicOS</h1>
  <label>Token <input id="token" value="dev-local-token"></label>
  <button id="connect">Connect</button>
  <span class="muted" id="tenant"></span>
  <span class="muted" id="roles"></span>
</header>

<section>
  <h2>Command centre</h2>
  <label>Capability <select id="capability"></select></label>
  <form id="create"><div id="fields"></div><button type="submit">Create record</button></form>
  <p id="status">idle</p>
  <table><thead><tr><th>id</th><th>reference</th><th>status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</section>

<section>
  <h2>Ask the clinic</h2>
  <textarea id="question" rows="2" cols="60">vaccination schedule for puppies</textarea>
  <div><button id="ask">Ask</button> <button id="ingest">Ingest as document</button></div>
  <p id="answer" class="muted"></p>
  <ul id="hits"></ul>
</section>

<section>
  <h2>Resident engineer</h2>
  <button id="posture">Refresh posture</button>
  <pre id="postureOut" class="muted"></pre>
</section>

<script>
const CAPABILITIES=["patient_records","appointment_scheduling","treatment_management","billing_invoicing","inventory_management","audit_trail","role_management","clinic_analytics"];
const $=id=>document.getElementById(id);
const token=()=>$("token").value.trim();
const headers=()=>({"Content-Type":"application/json","Authorization":"Bearer "+token()});
const setStatus=t=>{$("status").textContent=t};

async function jsonFetch(path,options){const r=await fetch(path,options);let b={};try{b=await r.json()}catch(e){}return[r,b]}

function renderFields(contract){const box=$("fields");box.innerHTML="";(contract.fields||[]).forEach(name=>{const rules=(contract.constraints||{})[name]||{};const label=document.createElement("label");label.textContent=name+" ";const value=rules.allowed_values?rules.allowed_values[0]:(rules.required?"sample":"");let el;if(rules.allowed_values){el=document.createElement("select");rules.allowed_values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)})}else{el=document.createElement("input");el.value=value}el.name=name;label.appendChild(el);box.appendChild(label)})}

async function loadCapability(){const cap=$("capability").value;const [cr,contract]=await jsonFetch("/v1/schema/"+cap,{headers:headers()});if(cr.ok)renderFields(contract);const [lr,list]=await jsonFetch("/v1/"+cap,{headers:headers()});const rows=$("rows");rows.innerHTML="";(list.items||[]).forEach(item=>{const tr=document.createElement("tr");[item.id,item.reference,item.status].forEach(v=>{const td=document.createElement("td");td.textContent=v==null?"":v;tr.appendChild(td)});const td=document.createElement("td");const b=document.createElement("button");b.textContent="Document";b.onclick=async()=>{const [dr,doc]=await jsonFetch("/v1/"+cap+"/"+item.id+"/document",{method:"POST",headers:headers()});setStatus(dr.ok?"document: "+JSON.stringify(doc.document).slice(0,120):"document refused")};td.appendChild(b);tr.appendChild(td);rows.appendChild(tr)})}

$("connect").onclick=async()=>{const [r,body]=await jsonFetch("/v1/roles",{headers:headers()});if(!r.ok){$("roles").textContent="connect refused ("+r.status+")";return}$("tenant").textContent="tenant: "+body.tenant.tenant_id;$("roles").textContent="roles: "+body.tenant.roles.join(", ");await loadCapability()};

$("create").onsubmit=async event=>{event.preventDefault();const payload={};(document.getElementById("fields").querySelectorAll("input,select")).forEach(el=>{if(el.value!=="")payload[el.name]=el.value});const [r,body]=await jsonFetch("/v1/"+$("capability").value,{method:"POST",headers:headers(),body:JSON.stringify(payload)});setStatus(r.ok&&body.ok!==false?"stored":"refused: "+(body.error||r.status));await loadCapability()};

$("capability").onchange=loadCapability;

$("ask").onclick=async()=>{const q=$("question").value;const [r,body]=await jsonFetch("/v1/rag/query",{method:"POST",headers:headers(),body:JSON.stringify({query:q,top_k:5})});$("answer").textContent=r.ok?(body.grounded?body.answer:"no corpus match — ingest a document first"):"refused";const list=$("hits");list.innerHTML="";(body.hits||[]).forEach(hit=>{const li=document.createElement("li");li.textContent=hit.doc_id+" ("+hit.score+") "+hit.text.slice(0,160);list.appendChild(li)})};

$("ingest").onclick=async()=>{await jsonFetch("/v1/rag/ingest",{method:"POST",headers:headers(),body:JSON.stringify({text:$("question").value,collection:"clinic_corpus"})});await $("ask").onclick()};

$("posture").onclick=async()=>{const out={};for(const [label,path,opts] of [["health","/health",{}],["offline","/v1/offline",{headers:headers()}],["llm","/v1/llm",{headers:headers()}]]){const [r,b]=await jsonFetch(path,opts);out[label]=r.ok?b:("HTTP "+r.status)}$("postureOut").textContent=JSON.stringify(out,null,2)};

CAPABILITIES.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;$("capability").appendChild(o)});
$("connect").onclick();
</script>
</body>
</html>
