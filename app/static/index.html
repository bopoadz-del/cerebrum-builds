<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetailOS</title>
</head>
<body>
<main data-product="retail">
  <h1>RetailOS</h1>
  <p>Retail operations: stock levels, sales and orders, customer insight,
  store analytics, purchasing, channel sync and audit — in one system.</p>
  <ul id="capabilities" data-source="/v1/capabilities"></ul>
  <p>Runtime health: <span id="health" data-source="/health">checking…</span></p>
  <script>
    fetch("/health")
      .then(function (r) { return r.ok ? "ok" : "degraded"; })
      .catch(function () { return "unreachable"; })
      .then(function (state) { document.getElementById("health").textContent = state; });
    fetch("/v1/capabilities")
      .then(function (r) { return r.json(); })
      .then(function (body) {
        var list = document.getElementById("capabilities");
        (body.items || []).forEach(function (item) {
          var li = document.createElement("li");
          li.setAttribute("data-capability", item.id);
          li.textContent = item.id + " — " + (item.http && item.http.create ? item.http.create : "");
          list.appendChild(li);
        });
      })
      .catch(function () {});
  </script>
</main>
</body>
</html>
