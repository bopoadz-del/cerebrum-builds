<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retail Ops Tracker</title>
  <style>
    :root { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: #14181c; color: #eef2f6; }
    body { margin: 0; }
    header { padding: 1.2rem 1.5rem; border-bottom: 1px solid #2b3640; }
    h1 { margin: 0; font-size: 1.4rem; }
    p.sub { margin: 0.35rem 0 0; color: #93a0ad; }
    nav { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.8rem 1.5rem; }
    nav button { background: #1c242c; color: #eef2f6; border: 1px solid #3a4a58; padding: 0.35rem 0.7rem; cursor: pointer; }
    nav button.active { background: #0f6e8a; }
    main { padding: 1rem 1.5rem 3rem; }
    label { display: block; margin: 0.6rem 0 0.2rem; }
    input, textarea, select { width: 100%; max-width: 36rem; background: #0d1116; color: #eef2f6; border: 1px solid #3a4a58; padding: 0.4rem; }
    button.act { margin-top: 0.8rem; background: #0f6e8a; color: #fff; border: 0; padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #0d1116; padding: 0.8rem; overflow: auto; }
    .mods { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
    .card { border: 1px solid #2b3640; padding: 0.7rem; }
  </style>
</head>
<body>
  <header>
    <h1>Retail Ops Tracker</h1>
    <p class="sub">Small-team inventory, orders, and alerts. Operator / admin. Mutations require a bearer operator token. OPERATOR_TOKEN is not stored in git.</p>
  </header>
  <nav id="nav"></nav>
  <main>
    <section id="command_center" class="panel">
      <h2>Command center</h2>
      <div class="mods" id="modules"></div>
    </section>
    <section id="live" class="panel">
      <h2 id="cap-title">inventory_tracking</h2>
      <label>Operator token <input id="operator-token" type="password" autocomplete="off" placeholder="OPERATOR_TOKEN" /></label>
      <label>Capability
        <select id="capability"></select>
      </label>
      <label>Reference <input id="reference" value="sample" /></label>
      <label>Status <input id="status" value="open" /></label>
      <button class="act" id="post-btn" type="button">POST create</button>
      <button class="act" id="get-btn" type="button">GET records</button>
      <pre id="out">Ready.</pre>
    </section>
    <section id="operational_chat" class="panel">
      <h2>Operational chat — retail notes</h2>
      <label>Title <input id="rag-title" value="Inventory count pack" /></label>
      <label>Text <textarea id="rag-text" rows="3">Inventory count, reorder threshold, and order status notes for the retail ops pilot.</textarea></label>
      <button class="act" id="ingest-btn" type="button">Ingest pack</button>
      <label>Query <input id="rag-q" value="inventory count" /></label>
      <button class="act" id="query-btn" type="button">Query notes</button>
    </section>
    <section id="resident_engineer" class="panel">
      <h2>Resident engineer</h2>
      <p class="sub">Same live POST/GET routes. No second API.</p>
    </section>
  </main>
  <script>
    const CAPS = [
      "inventory_tracking",
      "order_management",
      "ops_dashboard",
      "stock_alerts",
      "pilot_ops_log"
    ];
    const UI = ["command_center", "operational_chat", "resident_engineer"];
    const MAP = {
      command_center: "inventory_tracking",
      operational_chat: "order_management",
      resident_engineer: "ops_dashboard"
    };
    let current = "inventory_tracking";
    const nav = document.getElementById("nav");
    const modules = document.getElementById("modules");
    const capSelect = document.getElementById("capability");
    UI.forEach((name) => {
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => select(MAP[name] || "inventory_tracking", b);
      nav.appendChild(b);
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = name;
      modules.appendChild(card);
    });
    CAPS.forEach((name) => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = name;
      modules.appendChild(card);
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      capSelect.appendChild(opt);
    });
    capSelect.onchange = () => select(capSelect.value);
    function select(id, btn) {
      current = id;
      document.getElementById("cap-title").textContent = id;
      capSelect.value = id;
      [...nav.children].forEach((el) => el.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }
    function authHeaders() {
      const headers = {"Content-Type": "application/json"};
      const token = (document.getElementById("operator-token").value || "").trim();
      if (token) headers["Authorization"] = "Bearer " + token;
      return headers;
    }
    function extraFields(id) {
      const extras = {
        inventory_tracking: {sku: "sample", quantity_on_hand: 0, reorder_threshold: 0},
        order_management: {order_number: "sample", fulfillment_stage: "received"},
        ops_dashboard: {view_name: "sample", horizon: "today"},
        stock_alerts: {sku: "sample", alert_kind: "below_reorder"},
        pilot_ops_log: {note_title: "sample", note_body: "sample"}
      };
      return extras[id] || {};
    }
    document.getElementById("post-btn").onclick = async () => {
      const body = {
        reference: document.getElementById("reference").value || "sample",
        status: document.getElementById("status").value || "open",
        ...extraFields(current)
      };
      const res = await fetch("/v1/" + current, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("get-btn").onclick = async () => {
      const res = await fetch("/v1/" + current);
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("ingest-btn").onclick = async () => {
      const res = await fetch("/v1/rag/ingest", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          layer: 1,
          doc_id: document.getElementById("reference").value || "sample",
          title: document.getElementById("rag-title").value,
          text: document.getElementById("rag-text").value
        })
      });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("query-btn").onclick = async () => {
      const q = encodeURIComponent(document.getElementById("rag-q").value || "inventory");
      const res = await fetch("/v1/rag/query?q=" + q);
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
