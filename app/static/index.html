<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bakery Chain Operations & Delivery Platform</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0b1220; color: #e6edf7; }
      header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #1e293b; }
      h1 { margin: 0 0 .25rem; font-size: 1.35rem; }
      main { padding: 1.5rem; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      section { background: #111a2e; border: 1px solid #1e293b; border-radius: 10px; padding: 1rem; }
      h2 { margin: 0 0 .5rem; font-size: 1rem; text-transform: capitalize; }
      form { display: grid; gap: .5rem; }
      input, button { padding: .45rem .6rem; border-radius: 6px; border: 1px solid #334155; background: #0b1220; color: inherit; }
      button { background: #2563eb; border-color: #2563eb; cursor: pointer; font-weight: 600; }
      pre { overflow: auto; font-size: .78rem; background: #0b1220; padding: .6rem; border-radius: 6px; }
      .status { font-size: .85rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <header>
      <h1>Bakery Chain Operations & Delivery Platform</h1>
      <p class="status" id="status">chain status: checking…</p>
    </header>
    <main id="capabilities"></main>
    <script>
      const CAPABILITIES = [
        ["stock_inventory_management", "item_code", "FLOUR-01"],
        ["delivery_dispatch_tracking", "order_code", "ORDER-1001"],
        ["document_knowledge_qa", "document_title", "unit prices v1"],
        ["fleet_cost_and_pricing", "vehicle_code", "BIKE-04"],
        ["management_reporting_dashboard", "metric_name", "delivery_on_time"],
        ["user_roles_workforce", "user_name", "shop one operator"],
        ["operational_procedures_readiness", "procedure_code", "OPEN-SHOP-01"],
        ["audit_evidence_trail", "event_type", "stock_movement"],
      ];
      const TOKEN = localStorage.getItem("bakery_token") || "dev-local-token";
      const AUTH = { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN };

      fetch("/health").then((r) => r.json())
        .then((b) => { document.getElementById("status").textContent = "chain status: " + b.status; })
        .catch(() => { document.getElementById("status").textContent = "chain status: degraded"; });

      const root = document.getElementById("capabilities");
      CAPABILITIES.forEach(([capability, field, placeholder]) => {
        const section = document.createElement("section");
        section.innerHTML =
          "<h2>" + capability.replace(/_/g, " ") + "</h2>" +
          "<form><input name='reference' value='" + placeholder + "' /><input name='" + field + "' value='sample' />" +
          "<button type='submit'>Record</button></form><pre>loading…</pre>";
        const pre = section.querySelector("pre");
        const load = () =>
          fetch("/v1/" + capability)
            .then((r) => r.json())
            .then((b) => { pre.textContent = (b.items || []).length + " persisted record(s)"; })
            .catch(() => { pre.textContent = "unavailable"; });
        section.querySelector("form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const reference = event.target.reference.value;
          const value = event.target[1].value;
          const body = { reference, [field]: value, status: "open" };
          const response = await fetch("/v1/" + capability, {
            method: "POST", headers: AUTH, body: JSON.stringify(body),
          });
          const answer = await response.json();
          pre.textContent = JSON.stringify(answer, null, 2);
          load();
        });
        load();
        root.appendChild(section);
      });
    </script>
  </body>
</html>
