<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cerebrum Steward</title>
  <style>
    :root { font-family: Georgia, serif; background: #1c1914; color: #f4efe6; }
    body { margin: 0; }
    header { padding: 1.2rem 1.5rem; border-bottom: 1px solid #3d3428; }
    h1 { margin: 0; font-size: 1.4rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.8rem 1.5rem; }
    nav button { background: #2a241c; color: #f4efe6; border: 1px solid #5a4c38; padding: 0.35rem 0.7rem; cursor: pointer; }
    nav button.active { background: #8a6a32; }
    main { padding: 1rem 1.5rem 3rem; }
    label { display: block; margin: 0.6rem 0 0.2rem; }
    input, textarea { width: 100%; max-width: 36rem; background: #14110d; color: #f4efe6; border: 1px solid #5a4c38; padding: 0.4rem; }
    button.act { margin-top: 0.8rem; background: #8a6a32; color: #fff; border: 0; padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #14110d; padding: 0.8rem; overflow: auto; }
    .mods { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
    .card { border: 1px solid #3d3428; padding: 0.7rem; }
  </style>
</head>
<body>
  <header>
    <h1>Cerebrum Steward</h1>
    <p>Remote Asset &amp; Estate Operations — operator / admin</p>
  </header>
  <nav id="nav"></nav>
  <main>
    <section id="command_center" class="panel">
      <h2>Command center</h2>
      <div class="mods" id="modules"></div>
    </section>
    <section id="live" class="panel">
      <h2 id="cap-title">Capability</h2>
      <label>Reference <input id="reference" value="sample" /></label>
      <label>Status
        <input id="status" value="open" />
      </label>
      <button class="act" id="post-btn" type="button">POST create</button>
      <button class="act" id="get-btn" type="button">GET records</button>
      <pre id="out">Ready.</pre>
    </section>
  </main>
  <script>
    const CAPS = [
      "estate_registry","estate_maintenance","evidence_verifier","readiness_engine",
      "portfolio_rollup","house_manual_sop","vendor_budget","preventive_maintenance",
      "staff_scheduling","principal_dashboard","property_onboarding","dual_rag_sop",
      "dual_rag_estate_docs","composed_ops_loop","evidence_capture","human_authority_gate"
    ];
    const UI = [
      "command_center","principal_dashboard","estate_registry","house_manual",
      "maintenance","vendors","staff","readiness","onboarding","portfolio",
      "evidence","dual_rag","operational_chat","resident_engineer"
    ];
    const MAP = {
      command_center: "estate_registry",
      principal_dashboard: "principal_dashboard",
      estate_registry: "estate_registry",
      house_manual: "house_manual_sop",
      maintenance: "preventive_maintenance",
      vendors: "vendor_budget",
      staff: "staff_scheduling",
      readiness: "readiness_engine",
      onboarding: "property_onboarding",
      portfolio: "portfolio_rollup",
      evidence: "evidence_capture",
      dual_rag: "dual_rag_sop",
      operational_chat: "dual_rag_estate_docs",
      resident_engineer: "composed_ops_loop"
    };
    let current = "estate_registry";
    const nav = document.getElementById("nav");
    const modules = document.getElementById("modules");
    UI.forEach((name) => {
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => select(MAP[name] || "estate_registry", b);
      nav.appendChild(b);
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = name;
      modules.appendChild(card);
    });
    function select(id, btn) {
      current = id;
      document.getElementById("cap-title").textContent = id;
      [...nav.children].forEach((el) => el.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }
    document.getElementById("post-btn").onclick = async () => {
      const body = {
        reference: document.getElementById("reference").value || "sample",
        status: document.getElementById("status").value || "open"
      };
      const res = await fetch("/v1/" + current, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("get-btn").onclick = async () => {
      const res = await fetch("/v1/" + current);
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
