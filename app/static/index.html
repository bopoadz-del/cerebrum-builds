<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boutique Front Desk</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 1.5rem; background: #f6f5f2; color: #1d1d1b; }
      h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
      header p { margin: 0 0 1rem; color: #5c5a55; }
      section { background: #fff; border: 1px solid #e2e0da; border-radius: 8px;
                padding: 1rem; margin-bottom: 1rem; max-width: 60rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #eee; }
      input, button { font: inherit; padding: .35rem .5rem; }
      input { border: 1px solid #c9c7c0; border-radius: 4px; margin-right: .35rem; }
      button { border: 0; border-radius: 4px; background: #1d1d1b; color: #fff; cursor: pointer; }
      .row { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
      .warn { background: #fff4e5; border-color: #f0c98a; }
      .error { color: #a3231f; }
      .ok { color: #1c6b3c; }
    </style>
  </head>
  <body>
    <header>
      <h1>Boutique Front Desk</h1>
      <p>40 rooms. One arrival board. No paper log.</p>
      <div class="row">
        <label>Platform token <input id="token" size="24" /></label>
        <button id="reload">Reload board</button>
      </div>
    </header>

    <section id="health" class="warn" hidden></section>

    <section>
      <h2>Today's arrivals</h2>
      <table>
        <thead><tr><th>Guest</th><th>Room</th><th>Date</th><th>Arrived</th><th>Status</th></tr></thead>
        <tbody id="board"></tbody>
      </table>
      <p id="board-empty" hidden>No arrivals recorded yet.</p>
    </section>

    <section>
      <h2>Record a check-in</h2>
      <form id="checkin" class="row">
        <input name="reference" placeholder="reference" value="FD-1" required />
        <input name="guest_name" placeholder="guest name" required />
        <input name="room_number" placeholder="room" required />
        <input name="nights" type="number" min="1" max="30" value="1" required />
        <input name="arrival_time" placeholder="HH:MM:SS" value="15:00:00" required />
        <button type="submit">Record</button>
      </form>
      <p id="checkin-status"></p>
    </section>

    <section>
      <h2>Room availability</h2>
      <form id="availability" class="row">
        <input name="room_number" placeholder="room" required />
        <input name="check_in_date" type="date" required />
        <input name="check_out_date" type="date" required />
        <button type="submit">Check</button>
      </form>
      <p id="availability-status"></p>
    </section>

    <script>
      const TOKEN_KEY = "front-desk-token";
      const tokenInput = document.getElementById("token");
      tokenInput.value = localStorage.getItem(TOKEN_KEY) || "dev-local-token";
      tokenInput.addEventListener("change", () => {
        localStorage.setItem(TOKEN_KEY, tokenInput.value);
      });
      const headers = () => ({
        "Content-Type": "application/json",
        Authorization: "Bearer " + (localStorage.getItem(TOKEN_KEY) || "dev-local-token"),
      });
      const show = (id, text, cls) => {
        const node = document.getElementById(id);
        node.textContent = text;
        node.className = cls || "";
      };
      const formData = (form) => Object.fromEntries(new FormData(form).entries());

      async function loadBoard() {
        try {
          const board = await (await fetch("/v1/todays_arrivals_board", { headers: headers() })).json();
          const ledger = await (await fetch("/v1/record_checkin", { headers: headers() })).json();
          const rows = board.items || [];
          const body = document.getElementById("board");
          body.innerHTML = "";
          for (const row of rows) {
            const tr = document.createElement("tr");
            for (const value of [row.guest_name, row.room_number, row.arrival_date,
                                 row.arrived ? "arrived" : "expected", row.status]) {
              const td = document.createElement("td");
              td.textContent = String(value ?? "");
              tr.appendChild(td);
            }
            body.appendChild(tr);
          }
          document.getElementById("board-empty").hidden = rows.length > 0;
          if (!rows.length && (ledger.items || []).length) {
            document.getElementById("board-empty").textContent =
              (ledger.items || []).length + " check-in(s) recorded; no arrivals board rows yet.";
            document.getElementById("board-empty").hidden = false;
          }
        } catch (err) {
          show("board-empty", String(err), "error");
          document.getElementById("board-empty").hidden = false;
        }
      }

      async function loadHealth() {
        try {
          const health = await (await fetch("/v1/vendor_health", { headers: headers() })).json();
          const node = document.getElementById("health");
          if (health.ok) { node.hidden = true; return; }
          node.hidden = false;
          node.textContent = "Vendored blocks unavailable: " + (health.unavailable || []).join(", ");
        } catch (err) { /* health banner is advisory */ }
      }

      document.getElementById("reload").addEventListener("click", loadBoard);
      document.getElementById("checkin").addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = formData(event.target);
        payload.nights = Number(payload.nights);
        payload.status = "open";
        try {
          const body = await (await fetch("/v1/record_checkin", {
            method: "POST", headers: headers(), body: JSON.stringify(payload),
          })).json();
          if (body.ok === false) { show("checkin-status", body.error, "error"); return; }
          show("checkin-status", "Recorded " + payload.guest_name + " in room " + payload.room_number, "ok");
          event.target.reset();
          await loadBoard();
        } catch (err) { show("checkin-status", String(err), "error"); }
      });
      document.getElementById("availability").addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = formData(event.target);
        payload.reference = "desk-check";
        payload.status = "open";
        try {
          const body = await (await fetch("/v1/room_availability_check", {
            method: "POST", headers: headers(), body: JSON.stringify(payload),
          })).json();
          if (body.ok === false) { show("availability-status", body.error, "error"); return; }
          const stay = body.availability || {};
          show("availability-status",
            stay.is_available
              ? "Room " + stay.room_number + " is free for " + stay.nights + " night(s); charge "
                + (body.stay || {}).estimated_charge + " " + (body.stay || {}).currency
              : "Room " + stay.room_number + " is booked for those dates",
            stay.is_available ? "ok" : "error");
        } catch (err) { show("availability-status", String(err), "error"); }
      });

      loadBoard();
      loadHealth();
    </script>
  </body>
</html>
