<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel Front Desk Log</title>
  <!--
    Hotel Front Desk Log front-desk console.

    Written by the factory WRITER role (codewhale exec)

    This page is served by app/main.py (GET /) and talks to the same live API
    as frontend/ (the React source): POST /v1/record_check_in,
    GET /v1/list_todays_check_ins, GET /v1/record_check_in, GET /health. It
    needs no build step, so a deployed platform always has a working UI. The
    React app in frontend/ is the richer shell; `npm run build` emits dist/.
  -->
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    th, td { border-bottom: 1px solid #8884; text-align: left; padding: .25rem .5rem; }
    button { margin: .25rem .25rem .25rem 0; padding: .35rem .7rem; }
    label { display: inline-block; margin-right: .75rem; }
    input { padding: .25rem; }
    .error { color: #b3261e; }
    .ok { color: #1b7f3b; }
    pre { background: #8881; padding: .5rem; overflow: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>Hotel Front Desk Log</h1>
  <p>Record a guest check-in, and read today's check-ins. Nothing else.</p>
  <p>
    <label>Platform token <input id="token" value="dev-local-token" /></label>
    <button id="reload">Reload</button>
  </p>
  <p id="status"></p>
  <section>
    <h2>Check a guest in</h2>
    <p>
      <label>Guest <input id="guest" value="A. Guest" /></label>
      <label>Room <input id="room" value="101" /></label>
      <label>Guests <input id="count" type="number" min="1" max="20" value="1" /></label>
      <button id="checkin">Record check-in</button>
    </p>
    <pre id="checkinResult"></pre>
  </section>
  <div class="grid">
    <section>
      <h2>Today's check-ins</h2>
      <p>Read back from the platform: what the desk actually recorded.</p>
      <div id="today"></div>
    </section>
    <section>
      <h2>Platform health</h2>
      <pre id="health">…</pre>
    </section>
  </div>
</main>
<script>
(function () {
  function token() { return document.getElementById("token").value || "dev-local-token"; }
  function headers(extra) {
    var base = { Authorization: "Bearer " + token(), Accept: "application/json" };
    return Object.assign(base, extra || {});
  }
  function call(path, init) {
    return fetch(path, init || { headers: headers() }).then(function (response) {
      return response.text().then(function (text) {
        var body = text ? JSON.parse(text) : {};
        if (!response.ok) { throw new Error(response.status + " " + JSON.stringify(body).slice(0, 200)); }
        return body;
      });
    });
  }
  function status(message, bad) {
    var node = document.getElementById("status");
    node.textContent = message;
    node.className = bad ? "error" : "ok";
  }
  function day() { return new Date().toISOString().slice(0, 10); }
  function loadToday() {
    call("/v1/record_check_in?limit=50").then(function (payload) {
      var rows = (payload.items || []).filter(function (record) {
        return String(record.checked_in_at || "").slice(0, 10) === day();
      }).map(function (record) {
        return "<tr><td>" + record.id + "</td><td>" + (record.room_number || "") + "</td><td>" +
          (record.guest_name || "") + "</td><td>" + (record.checked_in_at || "") + "</td><td>" +
          (record.guests_count == null ? "" : record.guests_count) + "</td></tr>";
      }).join("");
      document.getElementById("today").innerHTML =
        "<table><thead><tr><th>id</th><th>room</th><th>guest</th><th>checked in</th><th>guests</th></tr></thead><tbody>" +
        rows + "</tbody></table>" +
        "<p>" + (payload.total || 0) + " check-in record(s) on file for " + day() + ".</p>";
    }).catch(function (exc) { status(String(exc), true); });
  }
  function loadHealth() {
    call("/health").then(function (body) {
      document.getElementById("health").textContent = JSON.stringify(body, null, 2);
    }).catch(function (exc) { document.getElementById("health").textContent = String(exc); });
  }
  function reload() {
    status("loading…");
    loadToday();
    loadHealth();
    status("front desk log ready for " + day());
  }
  document.getElementById("reload").addEventListener("click", reload);
  document.getElementById("checkin").addEventListener("click", function () {
    var stamp = new Date().toISOString();
    var payload = {
      reference: "FD-" + Date.now().toString(36),
      guest_name: document.getElementById("guest").value || "guest",
      room_number: document.getElementById("room").value || "unassigned",
      checked_in_at: stamp,
      guests_count: Number(document.getElementById("count").value || 1),
      status: "open",
      notes: "recorded at the front desk"
    };
    status("recording check-in…");
    call("/v1/record_check_in", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json" }),
      body: JSON.stringify(payload)
    }).then(function (body) {
      if (body.ok === false) { status(body.error || "refused", true); return; }
      document.getElementById("checkinResult").textContent = JSON.stringify(body.check_in || body, null, 2);
      status("check-in recorded");
      loadToday();
    }).catch(function (exc) { status(String(exc), true); });
  });
  reload();
}());
</script>
</body>
</html>
