<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LedgerFlow</title>
  <style>
    :root { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: #0f1418; color: #eef4f2; }
    body { margin: 0; }
    header { padding: 1.2rem 1.5rem; border-bottom: 1px solid #2a3b36; }
    h1 { margin: 0; font-size: 1.4rem; }
    p.sub { margin: 0.35rem 0 0; color: #93a8a0; }
    nav { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.8rem 1.5rem; }
    nav button { background: #18221f; color: #eef4f2; border: 1px solid #355249; padding: 0.35rem 0.7rem; cursor: pointer; }
    nav button.active { background: #0f7a5a; }
    main { padding: 1rem 1.5rem 3rem; }
    label { display: block; margin: 0.6rem 0 0.2rem; }
    input, textarea, select { width: 100%; max-width: 36rem; background: #0b100e; color: #eef4f2; border: 1px solid #355249; padding: 0.4rem; }
    button.act { margin-top: 0.8rem; background: #0f7a5a; color: #fff; border: 0; padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #0b100e; padding: 0.8rem; overflow: auto; }
    .mods { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
    .card { border: 1px solid #2a3b36; padding: 0.7rem; }
  </style>
</head>
<body>
  <header>
    <h1>LedgerFlow</h1>
    <p class="sub">Personal finance for operator / admin. Mutations require a bearer operator token. OPERATOR_TOKEN is not stored in git.</p>
  </header>
  <nav id="nav"></nav>
  <main>
    <section id="command_center" class="panel">
      <h2>Command center</h2>
      <div class="mods" id="modules"></div>
    </section>
    <section id="live" class="panel">
      <h2 id="cap-title">transaction_capture</h2>
      <label>Operator token <input id="operator-token" type="password" autocomplete="off" placeholder="OPERATOR_TOKEN" /></label>
      <label>Capability
        <select id="capability"></select>
      </label>
      <label>Reference <input id="reference" value="sample" /></label>
      <label>Status <input id="status" value="open" /></label>
      <button class="act" id="post-btn" type="button">POST create</button>
      <button class="act" id="get-btn" type="button">GET records</button>
      <pre id="out">Ready.</pre>
    </section>
    <section id="operational_chat" class="panel">
      <h2>Operational chat — finance packs</h2>
      <label>Title <input id="rag-title" value="Budget alert pack" /></label>
      <label>Text <textarea id="rag-text" rows="3">Budget alert and spending habit notes for LedgerFlow operators tracking income, expenses, and savings.</textarea></label>
      <button class="act" id="ingest-btn" type="button">Ingest pack</button>
      <label>Query <input id="rag-q" value="budget alert" /></label>
      <button class="act" id="query-btn" type="button">Query packs</button>
    </section>
    <section id="resident_engineer" class="panel">
      <h2>Resident engineer</h2>
      <p class="sub">Same live POST/GET routes. No second API.</p>
    </section>
  </main>
  <script>
    const CAPS = [
      "transaction_capture",
      "financial_dashboard",
      "budgeting_and_alerts",
      "report_generation",
      "audit_and_compliance",
      "data_synchronization"
    ];
    const UI = ["command_center", "operational_chat", "resident_engineer"];
    const MAP = {
      command_center: "transaction_capture",
      operational_chat: "budgeting_and_alerts",
      resident_engineer: "audit_and_compliance"
    };
    let current = "transaction_capture";
    const nav = document.getElementById("nav");
    const modules = document.getElementById("modules");
    const capSelect = document.getElementById("capability");
    UI.forEach((name) => {
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => select(MAP[name] || "transaction_capture", b);
      nav.appendChild(b);
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = name;
      modules.appendChild(card);
    });
    CAPS.forEach((name) => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = name;
      modules.appendChild(card);
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      capSelect.appendChild(opt);
    });
    capSelect.onchange = () => select(capSelect.value);
    function select(id, btn) {
      current = id;
      document.getElementById("cap-title").textContent = id;
      capSelect.value = id;
      [...nav.children].forEach((el) => el.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }
    function authHeaders() {
      const headers = {"Content-Type": "application/json"};
      const token = (document.getElementById("operator-token").value || "").trim();
      if (token) headers["Authorization"] = "Bearer " + token;
      return headers;
    }
    function extraFields(id) {
      const extras = {
        transaction_capture: {account_name: "sample", category: "income", amount: 1},
        financial_dashboard: {period: "month", currency: "USD"},
        budgeting_and_alerts: {budget_name: "sample", threshold_pct: 1},
        report_generation: {report_type: "pnl", period: "month"},
        audit_and_compliance: {event_action: "persist", evidence_label: "sample"},
        data_synchronization: {source_name: "sample", sync_mode: "push"}
      };
      return extras[id] || {};
    }
    document.getElementById("post-btn").onclick = async () => {
      const body = {
        reference: document.getElementById("reference").value || "sample",
        status: document.getElementById("status").value || "open",
        ...extraFields(current)
      };
      const res = await fetch("/v1/" + current, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("get-btn").onclick = async () => {
      const res = await fetch("/v1/" + current);
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("ingest-btn").onclick = async () => {
      const res = await fetch("/v1/rag/ingest", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          layer: 1,
          doc_id: document.getElementById("reference").value || "sample",
          title: document.getElementById("rag-title").value,
          text: document.getElementById("rag-text").value
        })
      });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("query-btn").onclick = async () => {
      const q = encodeURIComponent(document.getElementById("rag-q").value || "budget");
      const res = await fetch("/v1/rag/query?q=" + q);
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
