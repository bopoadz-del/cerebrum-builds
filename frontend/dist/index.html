<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Construction Platform — operator console</title>
<style>
  :root { --ink:#12212e; --line:#d7e0e8; --accent:#0b6b57; --warn:#8a5a00; --bg:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:#5b6b7a; font-size:12px; }
  main { padding:16px 20px 60px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  section h2 { font-size:14px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:#42566a; }
  label { display:block; font-size:12px; color:#42566a; margin:8px 0 2px; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 12px; margin-top:10px; cursor:pointer; }
  button.secondary { background:#42566a; }
  pre { background:#0f1c26; color:#d8e6ef; padding:10px; border-radius:6px; overflow:auto; max-height:230px; font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:#e6f2ee; color:var(--accent); margin-left:6px; }
  .badge.warn { background:#fdf3e2; color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; border-bottom:1px solid var(--line); padding:4px 6px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
</style>
</head>
<body>
<header>
  <h1>Construction Platform</h1>
  <span class="sub">civil works · United Arab Emirates · amounts in AED</span>
  <span class="sub" id="money-summary">money settings: loading…</span>
</header>

<main>
  <section>
    <h2>Job &amp; site record</h2>
    <label for="job_code">Job code</label><input id="job_code" value="JOB-1042" />
    <label for="job_name">Job name</label><input id="job_name" value="Al Ain road widening — phase 2" />
    <label for="site_name">Site</label><input id="site_name" value="Al Ain sector 4" />
    <label for="work_front">Work front</label><input id="work_front" value="Chainage 0+000 to 0+450" />
    <div class="row">
      <div><label for="progress_percent">Progress %</label><input id="progress_percent" type="number" value="35" /></div>
      <div><label for="snag_open_count">Snags open</label><input id="snag_open_count" type="number" value="4" /></div>
    </div>
    <button id="job-save">Save job record</button>
    <button class="secondary" id="job-refresh">Refresh jobs</button>
    <pre id="job-out">—</pre>
  </section>

  <section>
    <h2>Valuation / interim payment application</h2>
    <label for="valuation_number">Valuation no.</label><input id="valuation_number" value="IPC-07" />
    <div class="row">
      <div><label for="measured_quantity">Measured quantity</label><input id="measured_quantity" type="number" value="100" /></div>
      <div><label for="unit_rate_aed">Unit rate (AED)</label><input id="unit_rate_aed" type="number" value="250" /></div>
    </div>
    <div class="row">
      <div><label for="retention_percent">Retention % (blank = setting)</label><input id="retention_percent" type="number" placeholder="deployment setting" /></div>
      <div><label for="vat_rate_percent">VAT % (blank = setting)</label><input id="vat_rate_percent" type="number" placeholder="deployment setting" /></div>
    </div>
    <button id="val-price">Price this valuation</button>
    <button class="secondary" id="val-save">Save valuation record</button>
    <div id="val-authority"></div>
    <pre id="val-out">—</pre>
  </section>

  <section>
    <h2>Document Q&amp;A</h2>
    <label for="doc_query">Question about BOQs, drawings, method statements or price lists</label>
    <input id="doc_query" value="concrete grade" />
    <button id="doc-ask">Ask the document index</button>
    <pre id="doc-out">—</pre>
  </section>

  <section>
    <h2>Money settings</h2>
    <p class="sub">Country and currency come from the brief. Rates do not: the contractor sets them.</p>
    <table id="money-table"><tbody></tbody></table>
  </section>
</main>

<script>
const TOKEN = window.PLATFORM_TOKEN || "dev-local-token";
const auth = { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" };
const show = (id, value) => { document.getElementById(id).textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2); };
const num = (id) => { const v = document.getElementById(id).value.trim(); return v === "" ? null : Number(v); };

async function call(method, path, body) {
  const resp = await fetch(path, { method, headers: auth, body: body === undefined ? undefined : JSON.stringify(body) });
  let payload;
  try { payload = await resp.json(); } catch (e) { payload = { ok: false, error: "non-JSON response" }; }
  return { status: resp.status, body: payload };
}

document.getElementById("job-save").onclick = async () => {
  const record = {
    reference: "JOB-REF-" + Date.now(), status: "open",
    job_code: document.getElementById("job_code").value,
    job_name: document.getElementById("job_name").value,
    site_name: document.getElementById("site_name").value,
    work_front: document.getElementById("work_front").value,
    progress_percent: num("progress_percent"),
    snag_open_count: num("snag_open_count"),
  };
  const created = await call("POST", "/v1/job_and_site_tracking", record);
  const listed = await call("GET", "/v1/job_and_site_tracking");
  show("job-out", { post: created, stored_rows: (listed.body.items || []).length, latest: (listed.body.items || []).slice(-1)[0] });
};

document.getElementById("job-refresh").onclick = async () => {
  show("job-out", await call("GET", "/v1/job_and_site_tracking"));
};

document.getElementById("val-price").onclick = async () => {
  const priced = await call("POST", "/v1/formulas/valuation", {
    reference: document.getElementById("valuation_number").value,
    measured_quantity: num("measured_quantity"),
    unit_rate_aed: num("unit_rate_aed"),
    retention_percent: num("retention_percent"),
    vat_rate_percent: num("vat_rate_percent"),
  });
  const label = priced.body.valuation ? priced.body.valuation.authority_label : (priced.body.setting ? "setting required: " + priced.body.setting : priced.body.error);
  document.getElementById("val-authority").innerHTML = 'Authority: <span class="badge' + (priced.body.ok ? '' : ' warn') + '">' + label + "</span>";
  show("val-out", priced);
};

document.getElementById("val-save").onclick = async () => {
  const record = {
    reference: "VAL-REF-" + Date.now(), status: "open",
    valuation_number: document.getElementById("valuation_number").value,
    job_code: document.getElementById("job_code").value,
    measured_quantity: num("measured_quantity"),
    unit_rate_aed: num("unit_rate_aed"),
    gross_value_aed: (num("measured_quantity") || 0) * (num("unit_rate_aed") || 0),
    retention_percent: num("retention_percent"),
    vat_rate_percent: num("vat_rate_percent"),
  };
  const created = await call("POST", "/v1/commercials_and_valuations", record);
  const listed = await call("GET", "/v1/commercials_and_valuations");
  show("val-out", { post: created, stored_rows: (listed.body.items || []).length });
};

document.getElementById("doc-ask").onclick = async () => {
  const q = encodeURIComponent(document.getElementById("doc_query").value);
  show("doc-out", await call("GET", "/v1/rag/query?q=" + q));
};

async function loadMoney() {
  const resp = await call("GET", "/v1/settings/money");
  const settings = (resp.body.settings || {}).settings || {};
  const rows = Object.entries(settings).map(([name, meta]) =>
    "<tr><td>" + name + "</td><td>" + (meta.set ? meta.value : "not set") + "</td><td>" + (meta.description || "") + "</td></tr>");
  document.getElementById("money-table").querySelector("tbody").innerHTML =
    "<tr><th>Setting</th><th>Value</th><th>Meaning</th></tr>" + rows.join("");
  const missing = Object.entries(settings).filter(([, m]) => !m.set).map(([n]) => n);
  document.getElementById("money-summary").textContent =
    "AED · " + (missing.length ? "operator must set: " + missing.join(", ") : "all rates configured");
}
loadMoney();
</script>
</body>
</html>
