services:
  - type: web
    name: cerebrum-car-dealership
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: STORAGE_PATH
        value: /var/data
      - key: PYTHONUNBUFFERED
        value: "1"
