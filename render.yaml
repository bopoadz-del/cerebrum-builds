# Render blueprint (render-ready, not a live deploy).
# Written by the factory WRITER role (codewhale exec)
services:
  - type: web
    name: bakery-chain-ops
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: bakery-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STORAGE_PATH
        value: /data
      - key: PLATFORM_TOKEN
        sync: false
      - key: PORT
        value: "8000"
