# Render blueprint. One web service, no database and no key-value
# store: persistence is a sqlite file on the mounted disk (P1).
services:
  - type: web
    name: construction-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: STORAGE_PATH
        value: /app/data
    disk:
      name: construction-platform-data
      mountPath: /app/data
      sizeGB: 1
